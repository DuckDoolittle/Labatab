---
# =============================================================================
# Labatab - UbuntuS26 (Ubuntu Server 26.04 "Resolute Raccoon") Template Builder
# =============================================================================
# Run ON THE ANSIBLE SERVER (192.168.68.36), account "ansible":
#
#   cd /home/ansible/Labatab
#   ansible-playbook make_ubuntu_s26_template.yml
#
# What it does:
#   1. Downloads the official Ubuntu Server 26.04 cloud image
#      (resolute-server-cloudimg-amd64.img is a qcow2 file despite the .img
#      extension) and verifies it against Ubuntu's published SHA256SUMS.
#   2. Creates VM 500 "UbuntuS26" on the PVE host (192.168.68.8) via SSH,
#      imports the cloud image as scsi0, attaches a cloud-init drive (ide2),
#      enables the QEMU guest agent, sets DHCP networking.
#   3. Injects a first-boot cloud-init snippet (user-data) that:
#        - enables SSH password authentication (Ubuntu cloud images ship
#          /etc/ssh/sshd_config.d/60-cloudimg-settings.conf with
#          "PasswordAuthentication no"; sshd uses the FIRST value found and
#          sshd_config.d is Included at the TOP of sshd_config, so a drop-in
#          numbered LOWER than 60 wins. We write 00- to be certain.)
#        - restricts cloud-init to Proxmox-supported datasources (NoCloud,
#          ConfigDrive) so first boot does not waste ~30s probing EC2 etc.
#        - installs qemu-guest-agent + python3 (Ansible needs python3).
#        - enables/starts qemu-guest-agent and restarts ssh BEFORE cloud-init
#          finishes, so by the time SSH accepts connections the agent is up
#          and password auth is live.
#   4. Boots VM 500 once so cloud-init runs the snippet, waits (with
#      retries) for SSH to answer and the guest agent to report an IP,
#      verifies the expected state, then powers the VM off.
#   5. Cleans the cloud-init state INSIDE the template (cloud-init clean,
#      remove host keys + machine-id, remove netplan/mac binding, clear
#      DHCP leases, apt clean) so every future clone is a true first boot
#      with fresh host keys and no instance-id reuse.
#   6. Converts VM 500 into the "UbuntuS26" template.
#
# Idempotent: safe to re-run. If VM 500 already exists it is destroyed and
# rebuilt from scratch (configurable via rebuild_template: true).
# =============================================================================

- name: Build UbuntuS26 cloud-init template (VM 500) on Proxmox
  hosts: localhost
  connection: local
  become: no
  gather_facts: yes

  vars:
    # --- Proxmox target -------------------------------------------------------
    pve_node: "192.168.68.8"
    # NOTE: root SSH is disabled on the PVE host (per lab skill). Connect as
    # the "ansible" user and prefix every qm command with sudo.
    pve_ssh_user: "ansible"
    pve_ssh_key: "~/.ssh/id_ed25519"

    # --- Template identity ----------------------------------------------------
    template_id: 500
    template_name: "UbuntuS26"
    template_storage: "Local_0n1"     # directory-backed storage keeps qcow2
    template_bridge: "vmbr0"
    template_memory: 2048
    template_cores: 2
    template_disk_size: "32G"        # grown from the 3.5 GiB cloud image

    # --- Cloud image source (Ubuntu Server 26.04 LTS "Resolute Raccoon") -----
    # `current` always points at the newest daily build. SHA256 is verified
    # against the SHA256SUMS published in the same directory.
    image_url: "https://cloud-images.ubuntu.com/resolute/current/resolute-server-cloudimg-amd64.img"
    image_sums_url: "https://cloud-images.ubuntu.com/resolute/current/SHA256SUMS"
    image_filename: "resolute-server-cloudimg-amd64.img"
    # Downloaded onto the PVE host (kept there; deleted after import).
    pve_download_dir: "/var/lib/vz/template/iso"

    # --- Cloud-init user for the template -------------------------------------
    # The user/password requested for the template. Clones can override
    # ciuser/cipassword per-VM; the deploy playbook sets them explicitly.
    ci_user: "ansible"
    ci_password: "Th1s1s1t@ns1bl3"

    # --- Behaviour switches ---------------------------------------------------
    rebuild_template: true           # destroy existing VM 500 and rebuild
    verify_first_boot: true          # boot once, verify SSH/agent/IP, shut down
    keep_downloaded_image: false     # remove the .img from PVE after import

    # --- SSH from ansible server to PVE ---------------------------------------
    pve_ssh_opts: "-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -i {{ pve_ssh_key }}"

    # --- Local repo layout ----------------------------------------------------
    playbook_dir: "/home/ansible/Labatab"

  vars_prompt:
    - name: confirm_build
      prompt: "This will REBUILD (destroy if present) Proxmox template 500 (UbuntuS26) on 192.168.68.8. Continue? [yes/no]"
      default: "yes"
      private: no

  tasks:
    - name: Abort if not confirmed
      ansible.builtin.fail:
        msg: "Aborted by user."
      when: confirm_build | lower not in ['y', 'yes']

    # ------------------------------------------------------------------
    # 0. Preflight: reachability of PVE over SSH + passwordless sudo
    # ------------------------------------------------------------------
    - name: Preflight - verify SSH to PVE works
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} 'echo PVE-OK && hostname'
      register: pve_preflight
      changed_when: false
      delegate_to: localhost

    - name: Show PVE preflight result
      ansible.builtin.debug:
        var: pve_preflight.stdout

    - name: Preflight - confirm passwordless sudo works on PVE
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} 'sudo -n true && echo SUDO-OK'
      register: pve_sudo_check
      changed_when: false
      delegate_to: localhost

    - name: Fail fast if passwordless sudo is not available
      ansible.builtin.fail:
        msg: >-
          Passwordless sudo failed on {{ pve_node }} as {{ pve_ssh_user }}.
          The ansible user needs NOPASSWD sudo for qm on the PVE host.
      when: pve_sudo_check.rc != 0

    # ------------------------------------------------------------------
    # 1. Destroy existing template/VM 500 if rebuild is requested
    # ------------------------------------------------------------------
    - name: Check if VM/template 500 already exists
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "sudo qm status {{ template_id }}"
      register: existing_check
      changed_when: false
      failed_when: false
      delegate_to: localhost

    - name: Stop existing VM 500 if running
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "sudo qm stop {{ template_id }}"
      when:
        - rebuild_template | bool
        - existing_check.rc == 0
      delegate_to: localhost
      ignore_errors: yes

    - name: Destroy existing VM/template 500
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "sudo qm destroy {{ template_id }} --purge"
      when:
        - rebuild_template | bool
        - existing_check.rc == 0
      register: destroy_result
      delegate_to: localhost

    - name: Show destroy result
      ansible.builtin.debug:
        var: destroy_result.stdout
      when: destroy_result is defined and destroy_result.stdout is defined

    # ------------------------------------------------------------------
    # 2. Download the Ubuntu 26.04 cloud image ON THE PVE HOST
    #    (keeps the heavy transfer off the ansible server and puts the file
    #     where qm importdisk can read it directly)
    # ------------------------------------------------------------------
    - name: Download Ubuntu 26.04 cloud image on PVE (skip if present)
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "
          set -e
          cd {{ pve_download_dir }}
          if [ ! -f {{ image_filename }} ]; then
            wget -q -O {{ image_filename }}.part {{ image_url }}
            mv {{ image_filename }}.part {{ image_filename }}
          fi
          ls -la {{ image_filename }}
        "
      register: download_result
      delegate_to: localhost

    - name: Fetch SHA256SUMS for verification
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "curl -fsSL {{ image_sums_url }}"
      register: sums_raw
      delegate_to: localhost
      changed_when: false

    - name: Extract expected SHA256 for the image
      ansible.builtin.set_fact:
        expected_sha256: >-
          {{ (sums_raw.stdout_lines
              | select('search', image_filename ~ '$')
              | first
              | default('')
              | split)[0] | default('') }}

    - name: Fail if we could not parse an expected checksum
      ansible.builtin.fail:
        msg: "Could not find SHA256 for {{ image_filename }} in SHA256SUMS"
      when: expected_sha256 | length != 64

    - name: Compute actual SHA256 on PVE
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "sha256sum {{ pve_download_dir }}/{{ image_filename }}"
      register: actual_sha
      delegate_to: localhost
      changed_when: false

    - name: Verify image checksum
      ansible.builtin.fail:
        msg: >-
          Checksum mismatch! expected={{ expected_sha256 }}
          actual={{ actual_sha.stdout.split()[0] }}
      when: actual_sha.stdout.split()[0] != expected_sha256

    - name: Confirm image is real qcow2 (magic bytes) on PVE
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "head -c 4 {{ pve_download_dir }}/{{ image_filename }} | od -An -tx1 | tr -d ' \n'"
      register: magic_check
      delegate_to: localhost
      changed_when: false

    - name: Fail if the image is not qcow2
      ansible.builtin.fail:
        msg: >-
          {{ image_filename }} is not a qcow2 image (magic={{ magic_check.stdout }}).
          Refusing to import - a raw misread would corrupt the template.
      when: magic_check.stdout != '514649fb'

    # ------------------------------------------------------------------
    # 3. Create VM 500 shell
    # ------------------------------------------------------------------
    - name: Create VM 500 (UbuntuS26) shell
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "
          sudo qm create {{ template_id }} \
            --name {{ template_name }} \
            --ostype l26 \
            --memory {{ template_memory }} \
            --cores {{ template_cores }} \
            --net0 virtio,bridge={{ template_bridge }} \
            --scsihw virtio-scsi-single \
            --agent enabled=1 \
            --serial0 socket \
            --vga serial0 \
            --description 'Ubuntu Server 26.04 LTS cloud-init template - built by Ansible'
        "
      register: create_result
      delegate_to: localhost

    # ------------------------------------------------------------------
    # 4. Import the cloud image as scsi0
    #    qemu-img probes the real format, so the .img (actually qcow2)
    #    imports correctly. On dir storage we keep qcow2; on block storage
    #    PVE stores raw - both fine.
    # ------------------------------------------------------------------
    - name: Import cloud image as scsi0
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "
          sudo qm importdisk {{ template_id }} {{ pve_download_dir }}/{{ image_filename }} {{ template_storage }} --format qcow2
        "
      register: import_result
      delegate_to: localhost

    - name: Attach imported disk as scsi0 with SSD/discard flags
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "
          sudo qm set {{ template_id }} \
            --scsi0 {{ template_storage }}:vm-{{ template_id }}-disk-0,discard=on,ssd=1,iothread=1 \
            --boot order=scsi0
        "
      delegate_to: localhost

    - name: Resize template disk to 32G
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "sudo qm resize {{ template_id }} scsi0 {{ template_disk_size }}"
      register: resize_result
      delegate_to: localhost
      failed_when: false   # cloud-init grows the fs on first boot anyway

    # ------------------------------------------------------------------
    # 5. Attach cloud-init drive + set template cloud-init defaults
    # ------------------------------------------------------------------
    - name: Attach cloud-init drive (ide2)
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "sudo qm set {{ template_id }} --ide2 {{ template_storage }}:cloudinit,media=cdrom"
      delegate_to: localhost

    - name: Set template cloud-init defaults (user, password, DHCP)
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "
          sudo qm set {{ template_id }} \
            --ciuser {{ ci_user }} \
            --cipassword '{{ ci_password }}' \
            --ipconfig0 ip=dhcp
        "
      delegate_to: localhost
      no_log: true   # never echo the password into logs

    - name: Disable ciupgrade (we run apt update/upgrade ourselves on clones)
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "sudo qm set {{ template_id }} --ciupgrade 0"
      delegate_to: localhost

    # ------------------------------------------------------------------
    # 6. Write the first-boot cloud-init user-data snippet onto PVE
    #    (snippet storage = the 'local' storage on the PVE host)
    # ------------------------------------------------------------------
    - name: Ensure snippets directory exists on PVE
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "sudo mkdir -p /var/lib/vz/snippets && sudo chmod 755 /var/lib/vz/snippets"
      delegate_to: localhost

    - name: Write labatab first-boot user-data snippet locally (template copy)
      ansible.builtin.template:
        src: "snippets/labatab-ubuntuS26-userdata.yaml"
        dest: "/tmp/labatab-ubuntuS26-userdata.yaml"
        mode: "0644"
      delegate_to: localhost

    - name: Upload snippet to PVE snippets dir
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "sudo tee /var/lib/vz/snippets/labatab-ubuntuS26-userdata.yaml > /dev/null" < /tmp/labatab-ubuntuS26-userdata.yaml
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "sudo chmod 644 /var/lib/vz/snippets/labatab-ubuntuS26-userdata.yaml"
      delegate_to: localhost
      changed_when: true

    - name: Attach the custom user-data snippet via cicustom
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "sudo qm set {{ template_id }} --cicustom user=local:snippets/labatab-ubuntuS26-userdata.yaml"
      delegate_to: localhost

    - name: Regenerate cloud-init drive (apply cicustom + ciuser/cipassword)
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "sudo qm cloudinit update {{ template_id }}"
      delegate_to: localhost

    - name: Dump generated cloud-init user-data for the record (password masked)
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "sudo qm cloudinit dump {{ template_id }} user"
      register: cidump
      delegate_to: localhost
      changed_when: false
      no_log: true

    - name: Remove local copy of the snippet (tidy)
      ansible.builtin.file:
        path: "/tmp/labatab-ubuntuS26-userdata.yaml"
        state: absent
      delegate_to: localhost

    # ------------------------------------------------------------------
    # 7. (Optional) First-boot verification: boot, wait, check, shut down
    # ------------------------------------------------------------------
    - name: Start VM 500 for first-boot verification
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "sudo qm start {{ template_id }}"
      when: verify_first_boot | bool
      delegate_to: localhost

    - name: Wait for guest agent to report an IPv4 address (DHCP)
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "
          sudo qm guest cmd {{ template_id }} '{\"command\": \"network-get-interfaces\"}' \
          | python3 -c \"
        import sys, json
        data = json.load(sys.stdin)
        ifaces = data if isinstance(data, list) else data.get('result', [])
        for i in ifaces:
            if i.get('name') == 'lo':
                continue
            for a in i.get('ip-addresses', []):
                if a.get('ip-address-type') == 'ipv4' and not a.get('ip-address','').startswith('127.'):
                    print(a['ip-address']); sys.exit(0)
        sys.exit(1)
        \"
        "
      register: ip_wait
      when: verify_first_boot | bool
      delegate_to: localhost
      until: ip_wait.rc == 0
      retries: 60
      delay: 5
      changed_when: false

    - name: Set verified template IP fact
      ansible.builtin.set_fact:
        template_ip: "{{ ip_wait.stdout | trim }}"
      when: verify_first_boot | bool

    - name: Show discovered template IP
      ansible.builtin.debug:
        msg: "Template 500 first boot got IP {{ template_ip }} via DHCP"
      when: verify_first_boot | bool

    - name: Wait for SSH port 22 on the template IP
      ansible.builtin.wait_for:
        host: "{{ template_ip }}"
        port: 22
        delay: 10
        timeout: 300
        state: started
      when: verify_first_boot | bool
      delegate_to: localhost

    - name: Verify SSH login as ci_user works (accept fingerprint, retry until user exists)
      ansible.builtin.shell: |
        ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
            -i {{ pve_ssh_key }} {{ ci_user }}@{{ template_ip }} 'echo SSH-OK && hostname && cloud-init status --long'
      register: ssh_verify
      when: verify_first_boot | bool
      delegate_to: localhost
      until: ssh_verify.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: Verify qemu-guest-agent responds on PVE side
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "sudo qm agent {{ template_id }} ping"
      register: agent_ping
      when: verify_first_boot | bool
      delegate_to: localhost
      until: agent_ping.rc == 0
      retries: 12
      delay: 5
      changed_when: false

    - name: Show first-boot verification summary
      ansible.builtin.debug:
        msg:
          - "SSH verify: {{ ssh_verify.stdout_lines | default(['n/a']) }}"
          - "Agent ping: {{ agent_ping.stdout | default('n/a') }}"
      when: verify_first_boot | bool

    # ------------------------------------------------------------------
    # 8. Clean cloud-init state inside the guest, then shut down
    #    (done over the verified SSH session, before shutdown)
    # ------------------------------------------------------------------
    - name: Clean cloud-init state + host keys + machine-id inside template guest
      ansible.builtin.shell: |
        ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
            -i {{ pve_ssh_key }} {{ ci_user }}@{{ template_ip }} \
            'sudo bash -s' < {{ playbook_dir }}/scripts/labatab-template-firstboot-cleanup.sh
      when: verify_first_boot | bool
      delegate_to: localhost
      register: cleanup_result
      changed_when: true

    - name: Shut down template VM cleanly
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "sudo qm shutdown {{ template_id }}"
      when: verify_first_boot | bool
      delegate_to: localhost

    - name: Wait for template VM to be stopped
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "
          for i in $(seq 1 30); do
            status=$(sudo qm status {{ template_id }} | awk '{print $2}')
            [ \"$status\" = \"stopped\" ] && exit 0
            sleep 2
          done
          exit 1
        "
      when: verify_first_boot | bool
      register: stopped_wait
      until: stopped_wait.rc == 0
      retries: 5
      delay: 5
      delegate_to: localhost
      changed_when: false

    # ------------------------------------------------------------------
    # 9. Convert to template
    # ------------------------------------------------------------------
    - name: Convert VM 500 into template UbuntuS26
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "sudo qm template {{ template_id }}"
      register: template_result
      delegate_to: localhost

    - name: Show template conversion result
      ansible.builtin.debug:
        var: template_result.stdout

    # ------------------------------------------------------------------
    # 10. Optional cleanup of the downloaded image on PVE
    # ------------------------------------------------------------------
    - name: Remove downloaded cloud image from PVE (keep_downloaded_image=false)
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "sudo rm -f {{ pve_download_dir }}/{{ image_filename }}"
      when: not (keep_downloaded_image | bool)
      delegate_to: localhost

    # ------------------------------------------------------------------
    # 11. Final verification: template flag set + config sane
    # ------------------------------------------------------------------
    - name: Read final template config
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "sudo qm config {{ template_id }}"
      register: final_config
      delegate_to: localhost
      changed_when: false

    - name: Assert template flag is set
      ansible.builtin.fail:
        msg: "VM 500 is not flagged as a template!"
      when: "'template: 1' not in final_config.stdout"

    - name: Assert cloud-init drive present
      ansible.builtin.fail:
        msg: "No cloud-init drive (ide2) on template 500!"
      when: "'cloudinit' not in final_config.stdout"

    - name: Assert guest agent enabled
      ansible.builtin.fail:
        msg: "QEMU guest agent not enabled on template 500!"
      when: "'agent:' not in final_config.stdout or 'agent: 0' in final_config.stdout"

    - name: Display final template config (password masked by PVE)
      ansible.builtin.debug:
        var: final_config.stdout

    - name: Template build complete
      ansible.builtin.debug:
        msg:
          - "==============================================================="
          - " UbuntuS26 template ready: VMID 500 on 192.168.68.8"
          - " Storage: Local_0n1   Disk: 32G"
          - " Cloud-init user: ansible (password set, SSH pw auth enabled)"
          - " Networking: DHCP  |  Guest agent: enabled"
          - " Custom first-boot snippet: local:snippets/labatab-ubuntuS26-userdata.yaml"
          - "==============================================================="
          - " Deploy a new VM with:  ansible-playbook deploy_vm_from_template.yml"
          - "==============================================================="
