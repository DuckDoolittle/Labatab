---
# =============================================================================
# Labatab - Deploy a new VM from the UbuntuS26 template (VMID 500)
# =============================================================================
# Run ON THE ANSIBLE SERVER (192.168.68.36), account "ansible":
#
#   cd /home/ansible/Labatab
#   ansible-playbook deploy_vm_from_template.yml
#
# It will PROMPT you for the new VM's name, then:
#
#   1. Clones template 500 (UbuntuS26) to the next free VMID (full clone).
#   2. Sets the VM name, DHCP networking (ipconfig0 ip=dhcp), and the
#      cloud-init user "ansible" with the requested password.
#   3. Starts the VM.
#   4. Waits 45 seconds (requested) for first boot.
#   5. Discovers the VM's DHCP IP via the QEMU guest agent
#      (`qm guest cmd <vmid> network-get-interfaces`) with retries - this is
#      the reliable path that fixes the historic "can't connect to the new VM"
#      problem. We never guess the IP.
#   6. Connects over SSH, ACCEPTS THE FINGERPRINT automatically
#      (StrictHostKeyChecking=accept-new + ssh-keyscan), and verifies login.
#   7. Runs apt update + apt dist-upgrade.
#   8. Reboots IF NEEDED (checks /var/run/reboot-required), waits for return.
#   9. Re-runs the EXACT tasks from add_qemu.yml (install+enable
#      qemu-guest-agent) and deploy_clamav_wazuh_v2.yml (ClamAV + daily scan
#      cron + Wazuh ClamAV log monitoring + Wazuh agent install) against the
#      new VM by invoking those playbooks with --limit on the new host.
#  10. Adds the new VM to the inventory ([web_servers]) and to the dynamic
#      in-memory group so the same run can target it.
#
# Why this fixes "connecting to the new VM after it has been created":
#   - The Ubuntu cloud image ships /etc/ssh/sshd_config.d/60-cloudimg-settings.conf
#     with "PasswordAuthentication no". The template's first-boot snippet writes
#     /etc/ssh/sshd_config.d/00-labatab-password-auth.conf (00- sorts BEFORE 60-
#     and sshd uses the FIRST value found), so password SSH works.
#   - cloud-init is told to enable+start qemu-guest-agent and restart ssh
#     BEFORE it finishes, so the agent is answering by the time SSH is up.
#   - We discover the IP from the guest agent (not from a guessed
#     VMID=IP formula), so DHCP always resolves correctly.
#   - We ssh-keyscan the new host so the fingerprint is accepted, and we retry
#     the login until cloud-init has actually created the user (the user does
#     not exist the instant port 22 opens - this race is the classic failure).
#   - The add_host'd dynamic host gets StrictHostKeyChecking=accept-new.
# =============================================================================

- name: Provision new VM from UbuntuS26 template
  hosts: localhost
  connection: local
  become: no
  gather_facts: no

  vars:
    # --- Proxmox target -------------------------------------------------------
    pve_node: "192.168.68.8"
    pve_ssh_user: "ansible"
    pve_ssh_key: "~/.ssh/id_ed25519"
    pve_ssh_opts: "-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -i {{ pve_ssh_key }}"

    # --- Template to clone ----------------------------------------------------
    template_id: 500
    template_name: "UbuntuS26"
    vm_storage: "Local_0n1"
    vm_bridge: "vmbr0"
    vm_memory: 2048
    vm_cores: 2
    vm_disk_resize: "+28G"     # grow beyond the 32G template disk

    # --- New-VM cloud-init identity -------------------------------------------
    vm_ci_user: "ansible"
    vm_ci_password: "Th1s1s1t@ns1bl3"

    # --- Timing ---------------------------------------------------------------
    first_boot_wait_seconds: 45          # requested fixed wait after start
    ip_poll_retries: 90                  # x5s = up to ~7.5 min for DHCP+agent
    ip_poll_delay: 5
    ssh_login_retries: 40                # x10s = up to ~6.5 min for cloud-init user
    ssh_login_delay: 10

    # --- Inventory ------------------------------------------------------------
    inventory_path: "/home/ansible/Labatab/inventory"
    inventory_group: "web_servers"

    # --- Wazuh (matches deploy_clamav_wazuh_v2.yml / provision_new_vm.yml) -----
    wazuh_manager: "192.168.68.167"
    wazuh_group: "Servers"
    wazuh_pkg_url: "https://packages.wazuh.com/4.x/apt/pool/main/w/wazuh-agent/wazuh-agent_4.14.8-1_amd64.deb"
    clamav_log_path: "/var/log/clamav/clamav.log"

    # --- Playbooks to re-run against the new VM -------------------------------
    reapply_playbooks:
      - add_qemu.yml
      - deploy_clamav_wazuh_v2.yml

  vars_prompt:
    - name: vm_name
      prompt: "Enter the NAME for the new VM (e.g. Neo, Trinity, Ripley)"
      private: no

  tasks:
    # ------------------------------------------------------------------
    # 0. Validate the name the user typed
    # ------------------------------------------------------------------
    - name: Validate VM name (non-empty, safe characters)
      ansible.builtin.fail:
        msg: >-
          Invalid VM name '{{ vm_name }}'. Use letters, numbers, dashes only.
      when: vm_name is not defined or vm_name | length == 0 or not (vm_name is match('^[A-Za-z0-9][A-Za-z0-9-]*$'))

    - name: Announce deployment
      ansible.builtin.debug:
        msg: "Deploying new VM '{{ vm_name }}' from template {{ template_id }} ({{ template_name }}) on {{ pve_node }}"

    # ------------------------------------------------------------------
    # 1. Preflight: template exists and SSH/sudo to PVE work
    # ------------------------------------------------------------------
    - name: Preflight - template {{ template_id }} exists
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "sudo qm status {{ template_id }}"
      register: tpl_check
      changed_when: false
      delegate_to: localhost

    - name: Fail if the template is missing
      ansible.builtin.fail:
        msg: >-
          Template {{ template_id }} ({{ template_name }}) not found on {{ pve_node }}.
          Build it first:  ansible-playbook make_ubuntu_s26_template.yml
      when: tpl_check.rc != 0

    - name: Preflight - passwordless sudo works on PVE
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} 'sudo -n true && echo SUDO-OK'
      register: sudo_check
      changed_when: false
      delegate_to: localhost

    - name: Fail fast if passwordless sudo is not available
      ansible.builtin.fail:
        msg: "Passwordless sudo failed on {{ pve_node }} as {{ pve_ssh_user }}."
      when: sudo_check.rc != 0

    # ------------------------------------------------------------------
    # 2. Pick the next free VMID (max existing + 1)
    # ------------------------------------------------------------------
    - name: Get highest existing VMID on PVE
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "sudo qm list | awk 'NR>1 {print \$1}' | sort -n | tail -n 1"
      register: max_id
      changed_when: false
      delegate_to: localhost

    - name: Set new VMID fact (max + 1)
      ansible.builtin.set_fact:
        new_vm_id: "{{ (max_id.stdout | trim | int) + 1 }}"

    - name: Show chosen VMID
      ansible.builtin.debug:
        msg: "New VMID will be {{ new_vm_id }} (max existing was {{ max_id.stdout | trim }})"

    # ------------------------------------------------------------------
    # 3. Clone the template (full clone)
    # ------------------------------------------------------------------
    - name: Clone template {{ template_id }} to VM {{ new_vm_id }} ({{ vm_name }})
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "sudo qm clone {{ template_id }} {{ new_vm_id }} --name {{ vm_name }} --full 1 --storage {{ vm_storage }}"
      register: clone_result
      delegate_to: localhost

    - name: Show clone result
      ansible.builtin.debug:
        var: clone_result.stdout

    # ------------------------------------------------------------------
    # 4. Configure the clone: hardware + cloud-init (DHCP, user, password)
    # ------------------------------------------------------------------
    - name: Configure VM hardware
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "
          sudo qm set {{ new_vm_id }} \
            --memory {{ vm_memory }} \
            --cores {{ vm_cores }} \
            --net0 virtio,bridge={{ vm_bridge }} \
            --scsihw virtio-scsi-single \
            --agent enabled=1 \
            --serial0 socket \
            --vga serial0
        "
      delegate_to: localhost

    - name: Resize clone disk
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "sudo qm resize {{ new_vm_id }} scsi0 {{ vm_disk_resize }}"
      delegate_to: localhost
      failed_when: false

    - name: Set clone cloud-init identity + DHCP networking
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "
          sudo qm set {{ new_vm_id }} \
            --ciuser {{ vm_ci_user }} \
            --cipassword '{{ vm_ci_password }}' \
            --ipconfig0 ip=dhcp \
            --ciupgrade 0
        "
      delegate_to: localhost
      no_log: true   # never echo the password into logs

    - name: Regenerate clone cloud-init drive
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "sudo qm cloudinit update {{ new_vm_id }}"
      delegate_to: localhost

    # ------------------------------------------------------------------
    # 5. Start the VM and wait the requested 45 seconds
    # ------------------------------------------------------------------
    - name: Start VM {{ new_vm_id }} ({{ vm_name }})
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "sudo qm start {{ new_vm_id }}"
      register: start_result
      delegate_to: localhost

    - name: Wait {{ first_boot_wait_seconds }} seconds for first boot (requested)
      ansible.builtin.pause:
        seconds: "{{ first_boot_wait_seconds }}"

    # ------------------------------------------------------------------
    # 6. Discover the DHCP IP via the QEMU guest agent (reliable, no guessing)
    # ------------------------------------------------------------------
    - name: Poll guest agent for the VM's IPv4 address (DHCP)
      ansible.builtin.shell: |
        ssh {{ pve_ssh_opts }} {{ pve_ssh_user }}@{{ pve_node }} "
          sudo qm guest cmd {{ new_vm_id }} '{\"command\": \"network-get-interfaces\"}' \
          | python3 -c \"
        import sys, json
        data = json.load(sys.stdin)
        ifaces = data if isinstance(data, list) else data.get('result', [])
        for i in ifaces:
            if i.get('name') == 'lo':
                continue
            for a in i.get('ip-addresses', []):
                if a.get('ip-address-type') == 'ipv4' and not a.get('ip-address','').startswith('127.'):
                    print(a['ip-address']); sys.exit(0)
        sys.exit(1)
        \"
        "
      register: ip_poll
      until: ip_poll.rc == 0
      retries: "{{ ip_poll_retries }}"
      delay: "{{ ip_poll_delay }}"
      changed_when: false
      delegate_to: localhost

    - name: Set new VM IP fact
      ansible.builtin.set_fact:
        new_vm_ip: "{{ ip_poll.stdout | trim }}"

    - name: Announce discovered IP
      ansible.builtin.debug:
        msg: "VM {{ new_vm_id }} ({{ vm_name }}) discovered at {{ new_vm_ip }} via guest agent (DHCP)"

    # ------------------------------------------------------------------
    # 7. Accept the SSH fingerprint (ssh-keyscan) + verify login with retries
    #    (cloud-init may still be creating the user when port 22 first opens)
    # ------------------------------------------------------------------
    - name: Wait for SSH port 22 on {{ new_vm_ip }}
      ansible.builtin.wait_for:
        host: "{{ new_vm_ip }}"
        port: 22
        delay: 5
        timeout: 300
        state: started
      delegate_to: localhost

    - name: Accept the new host's SSH fingerprint (ssh-keyscan into known_hosts)
      ansible.builtin.shell: |
        ssh-keyscan -T 10 -t ed25519,rsa {{ new_vm_ip }} >> ~/.ssh/known_hosts 2>/dev/null || true
        ssh-keygen -F {{ new_vm_ip }} >/dev/null && echo FINGERPRINT-ACCEPTED
      register: keyscan
      changed_when: true
      delegate_to: localhost

    - name: Verify SSH login as {{ vm_ci_user }} (retry until cloud-init created the user)
      ansible.builtin.shell: |
        ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
            -i {{ pve_ssh_key }} {{ vm_ci_user }}@{{ new_vm_ip }} \
            'echo SSH-OK && hostname && id && cloud-init status --long'
      register: ssh_login
      until: ssh_login.rc == 0
      retries: "{{ ssh_login_retries }}"
      delay: "{{ ssh_login_delay }}"
      changed_when: false
      delegate_to: localhost

    - name: Show SSH verification
      ansible.builtin.debug:
        var: ssh_login.stdout_lines

    # ------------------------------------------------------------------
    # 8. Add the new VM to the inventory + dynamic in-memory group
    # ------------------------------------------------------------------
    - name: Add new VM to [{{ inventory_group }}] in inventory file
      ansible.builtin.lineinfile:
        path: "{{ inventory_path }}"
        line: "{{ vm_name }} ansible_host={{ new_vm_ip }}"
        insertafter: '\[{{ inventory_group }}\]'
        state: present
        create: yes
      delegate_to: localhost

    - name: Add new VM to dynamic in-memory group for this run
      ansible.builtin.add_host:
        name: "{{ new_vm_ip }}"
        groups: temporary_new_vm
        ansible_user: "{{ vm_ci_user }}"
        ansible_ssh_private_key_file: "{{ pve_ssh_key }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile={{ lookup('env','HOME') }}/.ssh/known_hosts"
        vm_name: "{{ vm_name }}"
        new_vm_id: "{{ new_vm_id }}"
      delegate_to: localhost

    - name: Refresh inventory so later plays see the new host
      ansible.builtin.meta: refresh_inventory
      delegate_to: localhost

# =============================================================================
# PLAY 2 - apt update + upgrade on the new VM, reboot if needed
# =============================================================================
- name: Update, upgrade, and reboot if needed on the new VM
  hosts: temporary_new_vm
  gather_facts: yes
  become: yes

  tasks:
    - name: Show target
      ansible.builtin.debug:
        msg: "Patching {{ vm_name }} ({{ inventory_hostname }})"

    - name: apt update
      ansible.builtin.apt:
        update_cache: yes
      register: apt_update_result

    - name: apt dist-upgrade
      ansible.builtin.apt:
        upgrade: dist
      register: apt_upgrade_result

    - name: Show upgrade summary
      ansible.builtin.debug:
        msg:
          - "apt update changed: {{ apt_update_result.changed }}"
          - "apt upgrade changed: {{ apt_upgrade_result.changed }}"

    - name: Check if a reboot is required (Debian/Ubuntu marker file)
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_marker

    - name: Show reboot decision
      ansible.builtin.debug:
        msg: >-
          Reboot required: {{ reboot_marker.stat.exists }}
          (marker /var/run/reboot-required)

    - name: Reboot the VM if needed and wait for it to return
      ansible.builtin.reboot:
        msg: "Reboot after apt dist-upgrade (requested by labatab deploy playbook)"
        reboot_timeout: 600
        post_reboot_delay: 30
        connect_timeout: 15
        test_command: "systemctl is-system-running --wait || true"
      when: reboot_marker.stat.exists

    - name: Wait for the VM to be fully reachable after (possible) reboot
      ansible.builtin.wait_for_connection:
        delay: 15
        timeout: 600
      when: reboot_marker.stat.exists

    - name: Confirm cloud-init completed on the new VM
      ansible.builtin.command: cloud-init status --long
      register: ci_status
      changed_when: false

    - name: Show cloud-init status
      ansible.builtin.debug:
        var: ci_status.stdout

# =============================================================================
# PLAY 3 - Re-run the EXACT processes from add_qemu.yml and
#          deploy_clamav_wazuh_v2.yml against ONLY the new VM.
# We invoke those playbooks directly with --limit so the new VM gets the
# identical configuration, task-for-task, that any other lab server gets.
# =============================================================================
- name: Re-apply add_qemu.yml and deploy_clamav_wazuh_v2.yml to the new VM
  hosts: localhost
  connection: local
  become: no
  gather_facts: no

  vars:
    pve_ssh_key: "~/.ssh/id_ed25519"
    playbook_dir: "/home/ansible/Labatab"
    new_host_ip: "{{ hostvars[groups['temporary_new_vm'][0]]['inventory_hostname'] }}"
    new_vm_ci_user: "ansible"

  tasks:
    - name: Re-run add_qemu.yml against the new VM only
      ansible.builtin.shell: |
        cd {{ playbook_dir }} && \
        LC_ALL=C.UTF-8 ansible-playbook add_qemu.yml \
          --limit {{ new_host_ip }} \
          --private-key {{ pve_ssh_key }} \
          -e ansible_user={{ new_vm_ci_user }} \
          -e ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
      register: qemu_apply
      changed_when: true
      delegate_to: localhost

    - name: Show add_qemu.yml result (tail)
      ansible.builtin.debug:
        msg: "{{ qemu_apply.stdout_lines[-15:] }}"

    - name: Re-run deploy_clamav_wazuh_v2.yml against the new VM only
      ansible.builtin.shell: |
        cd {{ playbook_dir }} && \
        LC_ALL=C.UTF-8 ansible-playbook deploy_clamav_wazuh_v2.yml \
          --limit {{ new_host_ip }} \
          --private-key {{ pve_ssh_key }} \
          -e ansible_user={{ new_vm_ci_user }} \
          -e ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
      register: clamav_apply
      changed_when: true
      delegate_to: localhost

    - name: Show deploy_clamav_wazuh_v2.yml result (tail)
      ansible.builtin.debug:
        msg: "{{ clamav_apply.stdout_lines[-15:] }}"

    - name: Install + start Wazuh agent on the new VM (same as provision_new_vm.yml)
      ansible.builtin.shell: |
        ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
            -i {{ pve_ssh_key }} {{ new_vm_ci_user }}@{{ new_host_ip }} \
            'sudo bash -s' \
            < {{ playbook_dir }}/scripts/labatab-wazuh-agent-install.sh
      environment:
        WAZUH_MANAGER: "{{ wazuh_manager }}"
        WAZUH_AGENT_GROUP: "{{ wazuh_group }}"
        WAZUH_PKG_URL: "{{ wazuh_pkg_url }}"
      register: wazuh_install
      changed_when: true
      delegate_to: localhost

    - name: Show Wazuh install result
      ansible.builtin.debug:
        var: wazuh_install.stdout_lines

# =============================================================================
# PLAY 4 - Final verification on the new VM
# =============================================================================
- name: Final verification on the new VM
  hosts: temporary_new_vm
  gather_facts: no
  become: yes

  tasks:
    - name: Verify qemu-guest-agent is active
      ansible.builtin.systemd:
        name: qemu-guest-agent
      register: qga_state
      changed_when: false

    - name: Verify ClamAV is installed
      ansible.builtin.command: clamscan --version
      register: clam_ver
      changed_when: false

    - name: Verify Wazuh agent is installed and running
      ansible.builtin.shell: |
        systemctl is-active wazuh-agent && /var/ossec/bin/wazuh-control status || true
      register: wazuh_state
      changed_when: false

    - name: Verify the daily ClamAV cron job exists
      ansible.builtin.command: crontab -l -u root
      register: cron_list
      changed_when: false
      failed_when: false

    - name: Verify SSH password auth is enabled (effective sshd config)
      ansible.builtin.shell: sshd -T | grep -i '^passwordauthentication'
      register: sshd_pwauth
      changed_when: false

    - name: Show final verification summary
      ansible.builtin.debug:
        msg:
          - "VM: {{ vm_name }} (VMID {{ new_vm_id }}) at {{ inventory_hostname }}"
          - "qemu-guest-agent: {{ qga_state.status.ActiveState }}"
          - "ClamAV: {{ clam_ver.stdout }}"
          - "Wazuh agent: {{ wazuh_state.stdout_lines | default(['n/a']) }}"
          - "Daily cron present: {{ 'wazuh_clamscan' in (cron_list.stdout | default('')) }}"
          - "sshd PasswordAuthentication: {{ sshd_pwauth.stdout }}"

    - name: Deployment complete
      ansible.builtin.debug:
        msg:
          - "==============================================================="
          - " New VM DEPLOYED: {{ vm_name }} (VMID {{ new_vm_id }})"
          - " IP: {{ inventory_hostname }}  (DHCP via guest agent)"
          - " User: ansible   |   apt updated + upgraded   |   rebooted if needed"
          - " add_qemu.yml + deploy_clamav_wazuh_v2.yml re-applied"
          - " Wazuh agent installed and started"
          - " Added to inventory [web_servers]"
          - "==============================================================="
