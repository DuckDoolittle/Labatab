---
- name: Update and upgrade packages on Debian-based systems
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Display target host information
      ansible.builtin.debug:
        msg:
          - "Target host: {{ inventory_hostname }}"
          - "OS family: {{ ansible_facts['os_family'] }}"
          - "Release: {{ ansible_facts['distribution_version'] | default('N/A') }}"
      ignore_errors: yes

    - name: Update apt package index
      ansible.builtin.apt:
        update_cache: yes
      register: apt_update_result
      ignore_errors: yes

    - name: Show apt update status
      ansible.builtin.debug:
        msg:
          - "Status: {{ 'SUCCESS' if not apt_update_result.failed else 'FAILED' }}"
          - "Changed: {{ apt_update_result.changed | default(False) }}"
          - "Message: {{ apt_update_result.msg | default('OK') | truncate(100, True) }}"
      when: apt_update_result is defined

    - name: Perform a dist-upgrade
      ansible.builtin.apt:
        upgrade: dist
      register: apt_upgrade_result
      ignore_errors: yes

    - name: Show apt upgrade status
      ansible.builtin.debug:
        msg:
          - "Status: {{ 'SUCCESS' if not apt_upgrade_result.failed else 'FAILED' }}"
          - "Packages changed: {{ apt_upgrade_result.changes | default(0) }}"
          - "Message: {{ apt_upgrade_result.msg | default('OK') | truncate(100, True) }}"
      when: apt_upgrade_result is defined

    - name: Show final summary
      ansible.builtin.debug:
        msg:
          - "=== HOST: {{ inventory_hostname }} ==="
          - "Update: {{ 'CHANGED' if apt_update_result.changed else 'NO CHANGES' }}"
          - "Upgrade: {{ 'CHANGED' if apt_upgrade_result.changed else 'NO CHANGES' }}"
          - "Any failures: {{ 'YES' if (apt_update_result.failed or apt_upgrade_result.failed) else 'NO' }}"